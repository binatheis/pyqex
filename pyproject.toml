[build-system]
requires = ["scikit-build-core>=0.5", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "pyqex"
version = "1.0.1"
description = "Python bindings for libQEx quad mesh extraction"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Hans-Christian Ebke", email = "ebke@cs.rwth-aachen.de"},
    {name = "Mattias Fagerlund"},
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
keywords = ["quad mesh", "mesh extraction", "geometry processing", "parameterization"]
dependencies = [
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://github.com/mfagerlund/pyqex"
Documentation = "https://github.com/mfagerlund/pyqex"
Repository = "https://github.com/mfagerlund/pyqex"
Issues = "https://github.com/mfagerlund/pyqex/issues"

[tool.scikit-build]
cmake.args = ["-DBUILD_PYTHON_BINDINGS=ON", "-DBUILD_DEMOS=OFF", "-DBUILD_SHARED_LIBS=OFF", "-DOPENMESH_BUILD_SHARED=OFF", "-DOPENMESH_BUILD_STATIC=ON", "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"]
wheel.packages = ["pyqex"]
wheel.install-dir = "pyqex"

[tool.scikit-build.cmake.define]
BUILD_PYTHON_BINDINGS = "ON"
BUILD_DEMOS = "OFF"
BUILD_SHARED_LIBS = "OFF"
FETCH_OPENMESH = "ON"
OPENMESH_BUILD_SHARED = "OFF"
OPENMESH_BUILD_STATIC = "ON"
