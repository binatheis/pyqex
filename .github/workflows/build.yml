name: Build wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_windows:
    name: Build Windows wheel
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: pip install build wheel numpy pybind11 scikit-build-core

      - name: Build wheel
        run: pip wheel . --no-deps -w dist
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-py${{ matrix.python-version }}
          path: dist/*.whl

  build_linux:
    name: Build Linux wheel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: pip install build wheel numpy pybind11 scikit-build-core

      - name: Build wheel
        run: pip wheel . --no-deps -w dist
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-py${{ matrix.python-version }}
          path: dist/*.whl

  build_macos:
    name: Build macOS wheel
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: pip install build wheel numpy pybind11 scikit-build-core

      - name: Build wheel
        run: pip wheel . --no-deps -w dist
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          MACOSX_DEPLOYMENT_TARGET: '11.0'

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-py${{ matrix.python-version }}
          path: dist/*.whl

  release:
    name: Create Release
    needs: [build_windows, build_linux, build_macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - name: List wheels
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.whl
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
